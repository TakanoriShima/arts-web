<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Yu Gothic, Meiryo, sans-serif" font-size="14">
  <rect x="0" y="0" width="640" height="400" fill="#fff"/>
  <text x="10" y="22" font-size="13">A と B は画面の外（消したい）、C は画面の中（残したい）とする。灰色 ＝ 消したい要素</text>

  <!-- ===== 左：前から ===== -->
  <text x="160" y="55" text-anchor="middle" font-weight="bold">前から調べる（i++）</text>
  <!-- step 1 -->
  <text x="10" y="92" font-size="13">i = 0</text>
  <g font-size="12" text-anchor="middle"><text x="95" y="72">[0]</text><text x="145" y="72">[1]</text><text x="195" y="72">[2]</text></g>
  <rect x="70" y="77" width="50" height="30" fill="#ccc" stroke="#000" stroke-width="3"/><text x="95" y="97" text-anchor="middle">A</text>
  <rect x="120" y="77" width="50" height="30" fill="#ccc" stroke="#000"/><text x="145" y="97" text-anchor="middle">B</text>
  <rect x="170" y="77" width="50" height="30" fill="#fff" stroke="#000"/><text x="195" y="97" text-anchor="middle">C</text>
  <text x="230" y="97" font-size="12">A を消す</text>
  <!-- step 2 -->
  <text x="10" y="152" font-size="13">i = 1</text>
  <g font-size="12" text-anchor="middle"><text x="95" y="132">[0]</text><text x="145" y="132">[1]</text></g>
  <rect x="70" y="137" width="50" height="30" fill="#ccc" stroke="#000"/><text x="95" y="157" text-anchor="middle">B</text>
  <rect x="120" y="137" width="50" height="30" fill="#fff" stroke="#000" stroke-width="3"/><text x="145" y="157" text-anchor="middle">C</text>
  <text x="180" y="150" font-size="12">B が [0] に詰まった。</text>
  <text x="180" y="166" font-size="12">i は 1 なので C を調べる</text>
  <!-- result -->
  <text x="10" y="212" font-size="13">結果</text>
  <rect x="70" y="197" width="50" height="30" fill="#ccc" stroke="#000"/><text x="95" y="217" text-anchor="middle">B</text>
  <rect x="120" y="197" width="50" height="30" fill="#fff" stroke="#000"/><text x="145" y="217" text-anchor="middle">C</text>
  <text x="70" y="250" font-weight="bold">× B を調べずに飛ばした</text>
  <text x="70" y="270" font-size="13">（消したい B が残ってしまう）</text>

  <line x1="320" y1="45" x2="320" y2="380" stroke="#000" stroke-dasharray="4 4"/>

  <!-- ===== 右：後ろから ===== -->
  <text x="480" y="55" text-anchor="middle" font-weight="bold">後ろから調べる（i--）</text>
  <!-- step 1 -->
  <text x="330" y="92" font-size="13">i = 2</text>
  <g font-size="12" text-anchor="middle"><text x="405" y="72">[0]</text><text x="455" y="72">[1]</text><text x="505" y="72">[2]</text></g>
  <rect x="380" y="77" width="50" height="30" fill="#ccc" stroke="#000"/><text x="405" y="97" text-anchor="middle">A</text>
  <rect x="430" y="77" width="50" height="30" fill="#ccc" stroke="#000"/><text x="455" y="97" text-anchor="middle">B</text>
  <rect x="480" y="77" width="50" height="30" fill="#fff" stroke="#000" stroke-width="3"/><text x="505" y="97" text-anchor="middle">C</text>
  <text x="540" y="97" font-size="12">C は残す</text>
  <!-- step 2 -->
  <text x="330" y="152" font-size="13">i = 1</text>
  <rect x="380" y="137" width="50" height="30" fill="#ccc" stroke="#000"/><text x="405" y="157" text-anchor="middle">A</text>
  <rect x="430" y="137" width="50" height="30" fill="#ccc" stroke="#000" stroke-width="3"/><text x="455" y="157" text-anchor="middle">B</text>
  <rect x="480" y="137" width="50" height="30" fill="#fff" stroke="#000"/><text x="505" y="157" text-anchor="middle">C</text>
  <text x="540" y="157" font-size="12">B を消す</text>
  <!-- step 3 -->
  <text x="330" y="212" font-size="13">i = 0</text>
  <rect x="380" y="197" width="50" height="30" fill="#ccc" stroke="#000" stroke-width="3"/><text x="405" y="217" text-anchor="middle">A</text>
  <rect x="430" y="197" width="50" height="30" fill="#fff" stroke="#000"/><text x="455" y="217" text-anchor="middle">C</text>
  <text x="490" y="210" font-size="12">詰まったのは調べ</text>
  <text x="490" y="226" font-size="12">終わった C だけ。A を消す</text>
  <!-- result -->
  <text x="330" y="272" font-size="13">結果</text>
  <rect x="380" y="257" width="50" height="30" fill="#fff" stroke="#000"/><text x="405" y="277" text-anchor="middle">C</text>
  <text x="380" y="310" font-weight="bold">○ 全部を調べられた</text>
  <text x="380" y="330" font-size="13">（消したい A・B が消え、C が残る）</text>

  <text x="320" y="375" text-anchor="middle" font-size="13">太い枠 ＝ そのとき調べている要素（i の番号）</text>
</svg>
