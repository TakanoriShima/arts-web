<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" font-family="Yu Gothic, Meiryo, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="270" fill="#fff"/>
  <!-- empty -->
  <text x="10" y="45" font-weight="bold">最初</text>
  <text x="90" y="45">bullets =</text>
  <rect x="170" y="25" width="40" height="30" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="190" y="46" text-anchor="middle">[ ]</text>
  <text x="230" y="45" font-size="13">空の配列（length は 0）</text>
  <!-- 1 -->
  <line x1="40" y1="60" x2="40" y2="92" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <text x="50" y="82" font-size="13">スペースで push</text>
  <text x="90" y="125">bullets =</text>
  <rect x="170" y="100" width="130" height="44" fill="#eee" stroke="#000" stroke-width="2"/>
  <text x="235" y="118" text-anchor="middle" font-size="12">bullets[0]</text>
  <text x="235" y="136" text-anchor="middle" font-size="12">{ x, y, w, h, speed }</text>
  <text x="320" y="125" font-size="13">length は 1</text>
  <!-- 2 -->
  <line x1="40" y1="148" x2="40" y2="180" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <text x="50" y="170" font-size="13">もう一度 push</text>
  <text x="90" y="213">bullets =</text>
  <rect x="170" y="188" width="130" height="44" fill="#eee" stroke="#000" stroke-width="2"/>
  <text x="235" y="206" text-anchor="middle" font-size="12">bullets[0]</text>
  <text x="235" y="224" text-anchor="middle" font-size="12">{ x, y, w, h, speed }</text>
  <rect x="300" y="188" width="130" height="44" fill="#eee" stroke="#000" stroke-width="2"/>
  <text x="365" y="206" text-anchor="middle" font-size="12">bullets[1]</text>
  <text x="365" y="224" text-anchor="middle" font-size="12">{ x, y, w, h, speed }</text>
  <text x="450" y="213" font-size="13">length は 2</text>
  <text x="300" y="258" text-anchor="middle" font-size="13">push するたびに、配列の最後に弾（オブジェクト）が 1 つ増える</text>
</svg>
