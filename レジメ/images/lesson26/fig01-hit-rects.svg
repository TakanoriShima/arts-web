<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="Yu Gothic, Meiryo, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="330" fill="#fff"/>
  <!-- ===== 左：a の各部分 ===== -->
  <text x="150" y="22" text-anchor="middle" font-weight="bold">四角形 a の左端・右端・上端・下端</text>
  <rect x="90" y="80" width="130" height="90" fill="#eee" stroke="#000" stroke-width="2"/>
  <text x="155" y="130" text-anchor="middle" font-weight="bold">a</text>
  <!-- x labels -->
  <line x1="90" y1="45" x2="90" y2="80" stroke="#000" stroke-dasharray="3 3"/>
  <line x1="220" y1="45" x2="220" y2="80" stroke="#000" stroke-dasharray="3 3"/>
  <text x="90" y="40" text-anchor="middle" font-size="13">a.x（左端）</text>
  <text x="220" y="40" text-anchor="middle" font-size="13">a.x + a.w（右端）</text>
  <line x1="92" y1="62" x2="218" y2="62" stroke="#000" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="155" y="58" text-anchor="middle" font-size="12">a.w（幅）</text>
  <!-- y labels -->
  <line x1="30" y1="80" x2="90" y2="80" stroke="#000" stroke-dasharray="3 3"/>
  <line x1="30" y1="170" x2="90" y2="170" stroke="#000" stroke-dasharray="3 3"/>
  <text x="5" y="76" font-size="13">a.y（上端）</text>
  <text x="5" y="190" font-size="13">a.y + a.h（下端）</text>
  <line x1="60" y1="82" x2="60" y2="168" stroke="#000" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="66" y="130" font-size="12">a.h</text>

  <line x1="320" y1="15" x2="320" y2="220" stroke="#000" stroke-dasharray="4 4"/>

  <!-- ===== 右：重なっている / いない ===== -->
  <text x="480" y="22" text-anchor="middle" font-weight="bold">重なっている → true</text>
  <rect x="370" y="40" width="110" height="70" fill="#eee" stroke="#000" stroke-width="2"/>
  <text x="395" y="62" font-weight="bold">a</text>
  <rect x="440" y="75" width="110" height="70" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="530" y="138" font-weight="bold">b</text>

  <text x="480" y="175" text-anchor="middle" font-weight="bold">離れている → false</text>
  <rect x="370" y="185" width="70" height="30" fill="#eee" stroke="#000" stroke-width="2"/>
  <text x="400" y="206" font-weight="bold">a</text>
  <rect x="490" y="185" width="70" height="30" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="520" y="206" font-weight="bold">b</text>

  <!-- ===== 下：isHit → if ===== -->
  <rect x="40" y="245" width="220" height="50" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="150" y="266" text-anchor="middle" font-weight="bold">isHit(a, b)</text>
  <text x="150" y="285" text-anchor="middle" font-size="12">4 つの条件がすべて成り立つか</text>
  <line x1="262" y1="270" x2="330" y2="270" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <text x="296" y="262" text-anchor="middle" font-size="12">true / false</text>
  <rect x="334" y="245" width="280" height="50" rx="6" fill="#eee" stroke="#000" stroke-width="2"/>
  <text x="474" y="266" text-anchor="middle" font-weight="bold">if (isHit(弾, 敵)) { … }</text>
  <text x="474" y="285" text-anchor="middle" font-size="12">true のときだけ、弾と敵を消して得点を増やす</text>
</svg>
