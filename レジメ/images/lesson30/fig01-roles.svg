<svg xmlns="http://www.w3.org/2000/svg" width="640" height="404" viewBox="0 0 640 404" font-family="Yu Gothic, Meiryo, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="400" fill="#fff"/>
  <!-- page (HTML) -->
  <rect x="20" y="20" width="300" height="360" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="30" y="40" font-size="12">index.html（HTML：画面の部品）</text>
  <rect x="35" y="52" width="270" height="30" fill="#eee" stroke="#000"/>
  <text x="170" y="72" text-anchor="middle" font-size="13">SCORE: 0　LIVES: 3</text>
  <rect x="35" y="90" width="270" height="70" fill="#eee" stroke="#000" stroke-dasharray="5 3"/>
  <text x="170" y="112" text-anchor="middle" font-size="13">GAME OVER のパネル</text>
  <text x="170" y="132" text-anchor="middle" font-size="12">最終得点・リスタートボタン</text>
  <text x="170" y="150" text-anchor="middle" font-size="11">（最初は CSS で隠す）</text>
  <rect x="35" y="170" width="270" height="200" fill="#bbb" stroke="#000" stroke-width="2"/>
  <text x="170" y="192" text-anchor="middle" font-size="13">&lt;canvas&gt;</text>
  <rect x="155" y="330" width="30" height="24" fill="#fff" stroke="#000"/>
  <rect x="166" y="290" width="6" height="14" fill="#fff" stroke="#000"/>
  <rect x="90" y="215" width="30" height="24" fill="#fff" stroke="#000"/>
  <rect x="220" y="240" width="30" height="24" fill="#fff" stroke="#000"/>
  <text x="170" y="275" text-anchor="middle" font-size="12">自機・弾・敵</text>
  <!-- roles right -->
  <rect x="380" y="40" width="240" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="500" y="62" text-anchor="middle" font-weight="bold">jQuery</text>
  <text x="500" y="84" text-anchor="middle" font-size="12">.text() .show() .hide() .on("click")</text>
  <line x1="378" y1="68" x2="310" y2="68" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <line x1="378" y1="80" x2="310" y2="120" stroke="#000" stroke-width="2" marker-end="url(#a)"/>

  <rect x="380" y="120" width="240" height="44" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="500" y="140" text-anchor="middle" font-weight="bold">CSS（style.css）</text>
  <text x="500" y="157" text-anchor="middle" font-size="12">見た目・パネルを最初は隠す</text>
  <line x1="378" y1="145" x2="310" y2="140" stroke="#000" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <rect x="380" y="200" width="240" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="500" y="222" text-anchor="middle" font-weight="bold">Canvas（ctx.fillRect）</text>
  <text x="500" y="244" text-anchor="middle" font-size="12">背景・自機・弾・敵を描く</text>
  <line x1="378" y1="228" x2="310" y2="228" stroke="#000" stroke-width="2" marker-end="url(#a)"/>

  <rect x="380" y="290" width="240" height="80" rx="6" fill="#ddd" stroke="#000" stroke-width="2"/>
  <text x="500" y="312" text-anchor="middle" font-weight="bold">JavaScript（main.js）</text>
  <text x="500" y="334" text-anchor="middle" font-size="12">ゲームループ・キー入力・移動・</text>
  <text x="500" y="352" text-anchor="middle" font-size="12">配列・当たり判定・得点と残機の計算</text>
  <line x1="500" y1="288" x2="500" y2="260" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <path d="M622,330 L632,330 L632,68 L624,68" stroke="#000" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="330" y="398" text-anchor="middle" font-size="12">JavaScript が、Canvas と jQuery に「描く・表示を変える」を指示する</text>
</svg>
